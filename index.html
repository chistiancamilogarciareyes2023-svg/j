<style>
:root{--bg:#eef2ee;--ink:#14231f;--mut:#5a6b66;--card:#fff;--line:#c9d3cd;--wood:#b9894f;--acc:#1f4fd8;--accbg:#dfe7fb;--hit:#fff3b0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a17;--ink:#e8f0ec;--mut:#9db0a9;--card:#1a2824;--line:#2e413b;--wood:#8a6a3f;--acc:#8fb0ff;--accbg:#1f2e55;--hit:#4a4310}}
:root[data-theme="dark"]{--bg:#101a17;--ink:#e8f0ec;--mut:#9db0a9;--card:#1a2824;--line:#2e413b;--wood:#8a6a3f;--acc:#8fb0ff;--accbg:#1f2e55;--hit:#4a4310}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Times New Roman",Times,serif}
header{padding:20px 16px 8px;max-width:760px;margin:auto}
h1{font:700 30px/1.1 "Times New Roman",Times,serif;margin:0 0 4px}
header p{margin:0;color:var(--mut)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 16px;max-width:760px;margin:auto;z-index:5}
input{width:100%;padding:12px 14px;font:inherit;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{flex:none;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#0b1220}}
main{max-width:760px;margin:auto;padding:4px 16px 90px}
.shelf{margin:18px 0}.shelf h2{font:700 16px "Times New Roman",Times,serif;margin:0 0 6px;color:var(--mut)}
.row{display:flex;gap:6px;align-items:stretch;padding-bottom:8px;border-bottom:8px solid var(--wood);border-radius:0 0 3px 3px;overflow-x:auto}
.it{flex:1 0 108px;min-height:96px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);text-align:left;font:inherit;font-size:14px;line-height:1.25;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.it small{color:var(--mut)}.it.hit{background:var(--hit);border-color:var(--acc);border-width:2px}.it.dim{opacity:.25}
.empty{padding:30px 0;color:var(--mut);text-align:center}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--acc);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .2s;z-index:9}
#sheet.on{transform:none}#sheet div{max-width:728px;margin:auto}#sheet h3{margin:0 0 6px;font:700 20px "Times New Roman",Times,serif}
#sheet p{margin:2px 0;color:var(--mut)}#sheet button{margin-top:10px;padding:10px 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
@media (prefers-color-scheme:dark){#sheet button{color:#0b1220}}
.it img{width:100%;height:72px;object-fit:contain;background:#fff;border-radius:4px}#sheet img{float:right;width:110px;height:110px;object-fit:contain;background:#fff;border-radius:8px;margin-left:12px}
.srow{display:flex;gap:8px}.srow input{flex:1;min-width:0}.scan{flex:none;padding:0 14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}#rd{margin-top:8px}#rd[hidden]{display:none}#reader{width:100%;border-radius:10px;overflow:hidden;margin-bottom:8px}#scmsg{margin:6px 0 0;font-size:15px;color:var(--mut)}#scmsg:empty{display:none}
@media (prefers-color-scheme:dark){.scan{color:#0b1220}}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
